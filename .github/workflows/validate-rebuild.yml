name: Validate MLD rebuild

on:
  push:
    branches:
      - "redesign/mld-rebuild-2026-10-11"
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check all application JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find api/src bot/src web/public -type f -name '*.js' -print0)
