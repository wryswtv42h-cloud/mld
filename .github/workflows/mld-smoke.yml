name: MLD syntax and smoke checks

on:
  push:
    branches:
      - main
      - redesign/mld-rebuild-2026-10-11
  pull_request:
    branches:
      - main

jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find api/src bot/src web/public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check essential MLD wiring
        run: node scripts/smoke-check.mjs
