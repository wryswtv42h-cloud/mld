name: Verify MLD source

on:
  push:
  pull_request:

jobs:
  syntax:
    name: JavaScript syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check web app
        run: node --check app.js
      - name: Check API
        run: node --check api/src/index.js
      - name: Check bot
        run: node --check bot/src/index.js
      - name: Check static server
        run: node --check server.js
