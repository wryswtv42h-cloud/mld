<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLD | لوحة التحكم</title>
<link rel="stylesheet" href="style.css">
<style>
.app{display:none;height:100vh}
body.logged .app{display:flex}
body.logged .auth-screen{display:none}
.auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:430px;border:1px solid var(--line);border-radius:26px;padding:38px 30px;background:linear-gradient(145deg,var(--card2),#17101f);box-shadow:0 25px 90px #0009}
.auth-card h2{font-size:32px;text-align:center;margin-bottom:8px;color:var(--accent);letter-spacing:5px}
.auth-card p{text-align:center;color:var(--muted);margin-bottom:25px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.tabs button.active{background:var(--accent);color:#241329;border-color:var(--accent)}
.field{margin-bottom:14px}
.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px;font-weight:600}
.field input,.field textarea{width:100%;padding:13px;background:#0d0914;border:1px solid #f0d8ef66;border-radius:12px;color:var(--text);font-size:14px;outline:0;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
.btn-primary{width:100%;padding:14px;border:0;border-radius:13px;color:#241329;background:linear-gradient(135deg,var(--accent),#e5a8d6);font-weight:900;font-size:15px;cursor:pointer}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px #f799d855}
.msg{margin-top:14px;padding:11px;border-radius:10px;text-align:center;font-size:13px;display:none}
.msg.show{display:block}
.msg.error{background:#ed424522;color:#ff8a8d}
.msg.success{background:#57f28722;color:#70f5b1}
.sidebar{width:250px;background:linear-gradient(180deg,rgba(24,14,36,.92),#17101f);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto}
.sidebar .brand{padding:0 20px 20px;border-bottom:1px solid var(--line);margin-bottom:15px}
.sidebar .brand h2{font-size:26px;letter-spacing:5px;background:linear-gradient(135deg,var(--accent),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar .nav a{display:flex;align-items:center;gap:12px;padding:13px 20px;color:var(--muted);text-decoration:none;font-size:15px;cursor:pointer;border-right:3px solid transparent}
.sidebar .nav a:hover{background:#ff9cde10;color:var(--text)}
.sidebar .nav a.active{background:#ff9cde15;color:var(--text);border-right-color:var(--pink)}
