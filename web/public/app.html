<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08060d">
  <title>MLD · لوحة التحكم</title>
  <link rel="icon" href="logo.svg.JPG">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="glow g1"></div>
  <div class="glow g2"></div>
  
  <header class="topbar">
    <nav class="wrap nav">
      <a class="brand" href="index.html"><img src="logo.svg.JPG" onerror="this.src='/logo.svg'"><span><b>MLD</b><small>DASHBOARD</small></span></a>
      <div id="nav-buttons"></div>
      <button id="menu-btn" class="menu" aria-label="قائمة"><span></span><span></span><span></span></button>
    </nav>
  </header>

  <main class="wrap container">
    <aside id="sidebar" class="sidebar">
      <div id="sidebar-content"></div>
    </aside>
    <section class="main-content">
      <div id="content"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button class="close" aria-label="إغلاق">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
