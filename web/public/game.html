<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MLD | لعبة</title>
<link rel="icon" href="logo.svg.JPG">
<link rel="stylesheet" href="style.css">
<style>
body{overflow:hidden}
.game-wrap{display:grid;grid-template-columns:1fr 320px;height:100vh;gap:0}
.game-main{position:relative;display:flex;flex-direction:column;padding:20px;overflow:hidden}
.game-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:20px}
.game-title{font-size:24px;color:var(--accent);font-weight:900}
.game-players{display:flex;gap:10px;flex-wrap:wrap}
.player-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--card2);font-size:13px}
.player-chip.active{border-color:var(--pink);box-shadow:0 0 20px #ff9cde55}
.player-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.table{flex:1;display:grid;place-items:center;position:relative;border-radius:30px;background:radial-gradient(circle at center,rgba(146,83,168,.3),transparent 70%);border:1px solid var(--line);margin-bottom:20px;overflow:hidden}
.table-inner{text-align:center}
.table h3{font-size:32px;color:var(--accent);margin-bottom:20px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.action-btn{border:1px solid var(--pink);border-radius:14px;padding:14px 24px;background:var(--accent);color:#241329;font-weight:900;cursor:pointer;font-size:15px}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px #f799d855}
.action-btn.secondary{background:transparent;color:var(--text);border-color:var(--line)}
.chat-side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(24,14,36,.7);backdrop-filter:blur(20px)}
.chat-head{padding:20px;border-bottom:1px solid var(--line);font-weight:900;color:var(--accent)}
.chat-body{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.chat-msg{background:#17101f;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.chat-msg b{color:var(--pink);font-size:12px}
.chat-input{display:flex;gap:8px;padding:15px;border-top:1px solid var(--line)}
.chat-input input{flex:1;background:#0d0914;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);outline:0}
.chat-input button{background:var(--accent);color:#241329;border:0;border-radius:10px;padding:10px 18px;font-weight:900;cursor:pointer}
.start-overlay{position:absolute;inset:0;background:rgba(8,6,13,.92);display:grid;place-items:center;z-index:10}
.start-overlay .box{text-align:center;max-width:500px}
.start-overlay h2{font-size:48px;color:var(--accent);margin-bottom:20px;letter-spacing:4px}
.start-overlay p{color:var(--muted);margin-bottom:25px;line-height:1.8}
.start-overlay .primary{font-size:18px;padding:18px 36px}
.game-info{padding:15px 0;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:820px){.game-wrap{grid-template-columns:1fr}.chat-side{position:fixed;bottom:0;right:0;left:0;height:40vh;z-index:20;border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>

<div class="game-wrap">
  <div class="game-main">
    <div class="game-header">
      <div class="game-title" id="gameTitle">جاري التحميل...</div>
      <div class="game-players" id="gamePlayers"></div>
    </div>
    <div class="table">
      <div class="table-inner">
        <h3 id="tableStatus">بانتظار اللاعبين...</h3>
        <div class="actions" id="gameActions"></div>
      </div>
    </div>
    <div class="game-info" id="gameInfo"></div>

    <div class="start-overlay" id="startOverlay">
      <div class="box">
        <h2>MLD</h2>
        <p id="overlayText">بانتظار بدء اللعبة...</p>
        <button class="primary" id="startBtn" style="display:none">ابدأ اللعبة</button>
      </div>
    </div>
  </div>

  <aside class="chat-side">
    <div class="chat-head">💬 شات الجلسة</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input">
      <input id="chatInput" placeholder="اكتب رسالة...">
      <button id="chatSend">إرسال</button>
    </div>
  </aside>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/game.js"></script>
</body>
</html>
