<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171020"><title>MLD · Community</title>
<link rel="icon" href="logo.svg.JPG"><link rel="stylesheet" href="style.css?v=20261011-visual-refresh3"><link rel="stylesheet" href="overrides.css?v=20261011-visual-refresh3">
</head>
<body>
<header class="topbar">
  <button id="menuBtn" type="button" aria-label="فتح القائمة">☰</button>
  <button class="brand" type="button" data-page="home"><img src="logo.svg.JPG" alt=""><span><b>MLD</b><small>COMMUNITY</small></span></button>
  <label class="search-shell" aria-label="البحث عن الأعضاء">
    <input id="globalSearch" type="search" placeholder="ابحث عن عضو أو رتبة..." autocomplete="off">
    <div id="globalSearchResults" class="search-results" role="listbox"></div>
  </label>
  <div class="actions"><button id="userLabel" class="user-label" type="button" aria-label="فتح حسابي">زائر</button><button id="authBtn" class="primary" type="button">دخول</button></div>
</header>
<div id="announcement"></div>
<div id="shade"></div>
<aside id="sidebar" aria-hidden="true"></aside>
<main id="app"></main>
<footer><div class="footBrand"><img src="logo.svg.JPG" alt=""><span><b>MLD · Community</b><small>مجتمع ملاذ</small></span></div></footer>
<div id="modal"></div><div id="toast" role="status"></div>
<a id="mldDiscordSupport" class="mld-discord-support" href="https://discord.gg/imld" target="_blank" rel="noopener" aria-label="الدعم عبر Discord"><b>الدعم عبر Discord</b></a>
<script>
(()=>{const link=document.getElementById('mldDiscordSupport');if(!link)return;const base=String(window.MLD_API_URL||'');const root=base.endsWith('/')?base.slice(0,-1):base;fetch(root+'/api/public/server',{headers:{Accept:'application/json'},cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(!data||!data.invite)return;try{const target=new URL(data.invite);const id=target.pathname.split('/').filter(Boolean).pop()||'';if(target.hostname==='discord.com'&&target.pathname.startsWith('/users/')&&/^\d{17,20}$/.test(id)){link.href=target.href;link.setAttribute('aria-label','التواصل المباشر مع فهد المطيري عبر Discord');const label=link.querySelector('b');if(label)label.textContent='تواصل مع المطوّر';}}catch{}}).catch(()=>{});})();
</script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js?v=20261011-visual-refresh3"></script>
<script src="enhancements.js?v=20261011-visual-refresh3"></script>
</body></html>
