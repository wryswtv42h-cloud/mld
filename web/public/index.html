<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLD | ملاذ — تسجيل الدخول</title>
<style>
  :root {
    --dark: #2F3136;
    --darker: #1E1F22;
    --silver: #C0C0C0;
    --silver-2: #E8E8E8;
    --beige: #F5F5DC;
    --gold: #D4AF37;
    --text: #E8E8E8;
    --danger: #ED4245;
    --success: #57F287;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at top, #3a3d42 0%, var(--darker) 70%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: linear-gradient(145deg, var(--dark), #26282c);
    border: 1px solid rgba(192, 192, 192, 0.15);
    border-radius: 20px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .logo {
    text-align: center;
    margin-bottom: 30px;
  }

  .logo h1 {
    font-size: 48px;
    background: linear-gradient(135deg, var(--silver-2), var(--silver), var(--beige));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    font-weight: 900;
  }

  .logo p {
    color: var(--silver);
    font-size: 14px;
    margin-top: 6px;
    letter-spacing: 2px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    color: var(--silver);
    font-size: 13px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .field input {
    width: 100%;
    padding: 14px 16px;
    background: var(--darker);
    border: 1px solid rgba(192, 192, 192, 0.15);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: all 0.25s;
  }

  .field input:focus {
    border-color: var(--silver);
    box-shadow: 0 0 0 3px rgba(192, 192, 192, 0.1);
  }

  .btn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--silver-2), var(--silver));
    color: var(--darker);
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.25s;
    letter-spacing: 1px;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(192,192,192,0.2); }
  .btn:active { transform: translateY(0); }

  .msg {
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    margin-top: 15px;
    display: none;
  }
  .msg.error { background: rgba(237,66,69,0.15); color: var(--danger); display: block; }
  .msg.success { background: rgba(87,242,135,0.15); color: var(--success); display: block; }

  .footer {
    text-align: center;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid rgba(192,192,192,0.1);
    color: var(--silver);
    font-size: 12px;
    line-height: 1.8;
  }

  .footer strong { color: var(--gold); }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>MLD</h1>
    <p>ملاذ</p>
  </div>

  <form id="loginForm">
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="username" required autocomplete="username">
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn">تسجيل الدخول</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="footer">
    <div>© جميع الحقوق محفوظة <strong>MLD</strong></div>
    <div>المطور: <strong>فهد المطيري</strong></div>
  </div>
</div>

<script>
  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : window.location.origin.replace('web', 'api');

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');

  function show(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    show('جاري التحقق...', 'success');

    try {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (!res.ok) {
        show(data.error || 'خطأ', 'error');
        return;
      }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      show('تم الدخول ✓', 'success');

      setTimeout(() => {
        window.location.href = 'app.html';
      }, 600);

    } catch (err) {
      show('تعذر الاتصال بالسيرفر', 'error');
    }
  });
</script>

</body>
</html>
